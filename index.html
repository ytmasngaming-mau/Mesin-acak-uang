<!DOCTYPE html>
<html>
<head>
<title>Mesin Acak Uang</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:#f4f6f9;font-family:Arial;padding:20px;margin:0">

<div id="kotak" style="max-width:350px;margin:auto;background:white;padding:20px;border-radius:10px">
<h2 style="color:#007bff;text-align:center">Mesin Acak Uang</h2>

<button onclick="show(1)" id="btn1" style="width:50%;padding:10px;background:#007bff;color:white;border:0;float:left">Daftar</button>
<button onclick="show(2)" id="btn2" style="width:50%;padding:10px;background:#ccc;border:0;float:left">Masuk</button>
<div style="clear:both"></div>

<div id="daftar" style="margin-top:15px">
<p>Buat akun baru</p>
<input id="email1" placeholder="Email" style="width:100%;padding:10px;margin:5px 0;box-sizing:border-box">
<input id="pass1" type="password" placeholder="Password" style="width:100%;padding:10px;margin:5px 0;box-sizing:border-box">
<button onclick="daftar()" style="width:100%;padding:12px;background:#28a745;color:white;border:0">Daftar Akun Baru</button>
</div>

<div id="masuk" style="display:none;margin-top:15px">
<p>Masuk akun</p>
<input id="email2" placeholder="Email" style="width:100%;padding:10px;margin:5px 0;box-sizing:border-box">
<input id="pass2" type="password" placeholder="Password" style="width:100%;padding:10px;margin:5px 0;box-sizing:border-box">
<button onclick="login()" style="width:100%;padding:12px;background:#007bff;color:white;border:0">Masuk Akun</button>
</div>
</div>

<div id="app" style="display:none;text-align:center;padding:20px">
<h2>Halo <span id="nama"></span></h2>
<p>Selamat datang bree 🔥</p>
<p>Saldo: Rp 0</p>
<p>Poin: 50 Poin</p>
<button onclick="logout()" style="padding:10px;background:red;color:white;border:0">Logout</button>
</div>

<script>
const supa = window.supabase.createClient(
'https://hubhcrryalyjmldqilzo.supabase.co',
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1YmhjcnJ5YWx5am1sZHFpbHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMjk0NjYsImV4cCI6MjEwNDgwNTQ2Nn0.Z5Xqim33fG4u9cMqLUMs7k050rB_bFBDx77rSmAz1EU'
);

function show(n){
if(n==1){daftar.style.display='block';masuk.style.display='none';btn1.style.background='#007bff';btn2.style.background='#ccc'}
else{daftar.style.display='none';masuk.style.display='block';btn1.style.background='#ccc';btn2.style.background='#007bff'}
}

async function daftar(){
let e=email1.value,p=pass1.value;
if(!e||!p) return alert('Isi semua');
let {error}=await supa.auth.signUp({email:e,password:p});
if(error)alert('Error: '+error.message);
else alert('Sukses!\n\nSilahkan periksa email '+e+'\nKlik link verifikasi di Gmail');
}

async function login(){
let e=email2.value,p=pass2.value;
if(!e||!p) return alert('Isi semua');
let {data,error}=await supa.auth.signInWithPassword({email:e,password:p});
if(error)alert('Error: '+error.message);
else if(!data.user.email_confirmed_at)alert('Verifikasi email dulu di Gmail');
else{kotak.style.display='none';app.style.display='block';nama.innerText=e.split('@')[0]}
}

function logout(){supa.auth.signOut();location.reload()}
</script>
</body>
</html>
